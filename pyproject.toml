[project]
name = "alpha-desk"
version = "0.1.0"
description = "Multi-agent investment-research cockpit (web UI + FastAPI backend + scheduled brief pipeline)."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.138.1",
    "uvicorn[standard]==0.49.0",
    "openai==2.46.0",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.1",
    "requests==2.32.5",
    "PyMySQL==1.2.0",
    "DBUtils==3.1.2",
    "yfinance==1.2.0",
    "pandas==3.0.1",
    "lxml==6.1.1",
    "ta==0.11.0",
    "fredapi==0.5.2",
    "matplotlib==3.10.8",
    "feedparser==6.0.12",
    "youtube-transcript-api==1.2.4",
    "google-api-python-client==2.190.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "ruff==0.15.22",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
